<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کاربران — CiaNet Panel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><div class="loading">در حال بارگذاری…</div></div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
  <script>
    (async () => {
      const user = await checkAuth();
      if (!user) { location.href = "login.html"; return; }

      async function load(q = "") {
        const params = new URLSearchParams({ q, page: "1", page_size: "100" });
        const r = await api(`/api/users?${params}`);
        const rows = (r.items || []).map(u => `
          <tr>
            <td class="font-mono text-sm">${u.user_id}</td>
            <td>${u.username || "—"}</td>
            <td><span class="badge badge-yellow">${u.role || "USER"}</span></td>
            <td>${u.plan || "—"}</td>
            <td>${u.sub_status === "active" ? "✅ فعال" : u.sub_status === "expired" ? "❌ منقضی" : "—"}</td>
            <td class="text-sm">${u.expire_date || "—"}</td>
            <td>
              <button class="btn" onclick="extendUser(${u.user_id})">تمدید</button>
              <button class="btn btn-danger" onclick="deleteUser(${u.user_id})">حذف</button>
            </td>
          </tr>
        `).join("");
        document.getElementById("app").innerHTML = layout(`
          <div class="header"><h1>کاربران</h1><span class="text-muted text-sm">مجموع: ${fmt(r.total || 0)}</span></div>
          <input class="input mb-4" placeholder="جستجو با ایدی عددی یا یوزرنیم…" onkeyup="searchUsers(this.value)">
          <div class="card">
            <table>
              <thead><tr>
                <th>user_id</th><th>username</th><th>نقش</th><th>پلن</th><th>اشتراک</th><th>انقضا</th><th>عملیات</th>
              </tr></thead>
              <tbody id="usersBody">${rows}</tbody>
            </table>
          </div>
        `);
      }

      window.searchUsers = (q) => { if (q.length >= 1) load(q); };
      window.extendUser = async (uid) => {
        const days = prompt("تعداد روز تمدید:", "30");
        if (!days) return;
        try {
          await api(`/api/users/${uid}/extend`, {
            method: "POST", body: JSON.stringify({ days: parseInt(days) })
          });
          showToast("تمدید شد ✓");
          load();
        } catch (e) { showToast(e.message, true); }
      };
      window.deleteUser = async (uid) => {
        if (!confirm(`حذف کامل کاربر ${uid}؟`)) return;
        try {
          await api(`/api/users/${uid}`, { method: "DELETE" });
          showToast("حذف شد ✓");
          load();
        } catch (e) { showToast(e.message, true); }
      };

      load();
    })();
  </script>
</body>
</html>
