<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CiaNet — سفارش‌ها</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .order-card { padding: 12px; background: rgba(15,23,42,0.4); border-radius: 6px; border-left: 3px solid var(--border); margin-bottom: 10px; }
    .order-card.paid { border-left-color: var(--success); }
    .order-card.pending { border-left-color: var(--accent); }
    .order-card.expired, .order-card.cancelled { border-left-color: var(--danger); opacity: 0.7; }
    .order-meta { color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; }
    .pay-btn { margin-top: 8px; padding: 6px 12px; background: var(--accent); border: none; border-radius: 4px; color: #1a1a1a; cursor: pointer; font-family: inherit; font-size: 0.9rem; }
    .pay-btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="brand">CiaNet</div>
    <div class="nav-items">
      <a href="dashboard.html">داشبورد</a>
      <a href="accounts.html">🤖 اکانت‌ها</a>
      <a href="chats.html">💬 چت‌ها</a>
      <a href="wallet.html">💰 کیف پول</a>
      <a href="orders.html" class="active">🧾 سفارش‌ها</a>
      <a href="account_settings.html">⚙️ تنظیمات</a>
      <button id="logout-btn" class="link-btn">خروج</button>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h2>🧾 سفارش‌های شما</h2>
      <div id="orders-list">در حال بارگذاری...</div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    async function loadOrders() {
      const me = await requireAuth();
      if (!me) return;
      try {
        const data = await apiCall('GET', '/api/user/orders');
        renderOrders(data.orders || []);
      } catch (err) {
        document.getElementById('orders-list').textContent = 'خطا: ' + err.message;
      }
    }
    function renderOrders(orders) {
      const c = document.getElementById('orders-list');
      if (!orders.length) {
        c.innerHTML = '<p class="hint">هنوز سفارشی ثبت نشده. در ربات تلگرام «🛒 خرید سلف» بزن.</p>';
        return;
      }
      c.innerHTML = '';
      const statusMap = {
        pending: '⏳ در انتظار پرداخت',
        paid: '✅ پرداخت شد',
        expired: '❌ منقضی شد',
        cancelled: '🚫 لغو شد',
      };
      for (const o of orders) {
        const div = document.createElement('div');
        div.className = 'order-card ' + o.status;
        const date = fmtDate(o.created_at);
        let discountHtml = '';
        if (o.discount_code) {
          discountHtml = `<div style="color:var(--accent);font-size:0.85rem;margin-top:4px">🎁 تخفیف: ${escapeHtml(o.discount_code)} (${faDigits(o.discount_percent)}%)</div>`;
        }
        let payBtnHtml = '';
        if (o.status === 'pending') {
          // v2.23.5 (AUDIT-43 43-d#5): دکمهٔ پرداخت با data-attributes — قبلاً
          // order_no داخلِ رشتهٔ JSِ تک‌کوتیشن‌دار در attribute می‌نشست و
          // escapeHtml فقط &#39; می‌داد که HTML parser قبل از JS آن را به '
          // decode می‌کند = امکان شکستن به JS دلخواه (latent — order_no
          // سرور-ساخته است ولی الگوی خطرناک است). حالا مقادیر فقط در
          // dataset و listener امن خوانده می‌شوند.
          payBtnHtml = `<button class="pay-btn" data-oid="${o.id}" data-order-no="${escapeHtml(o.order_no)}" data-amount="${o.amount_toman}">💰 پرداخت با کیف پول (${faDigits(o.amount_toman)} Toman)</button>`;
        }
        div.innerHTML = `
          <div><strong>${escapeHtml(o.order_no)}</strong> — ${escapeHtml(o.plan)}</div>
          <div class="order-meta">
            ${faDigits(o.amount_toman)} Toman
            ${o.discount_code ? ' · <s>' + faDigits(o.original_amount_toman) + '</s>' : ''}
            · ${escapeHtml(statusMap[o.status] || o.status)}
            · ${date}
          </div>
          ${discountHtml}
          ${payBtnHtml}
        `;
        c.appendChild(div);
      }
    }
    async function payWithWallet(oid, orderNo, amount) {
      if (!confirm(`پرداخت ${faDigits(amount)} Toman از کیف پول برای فاکتور ${orderNo}؟`)) return;
      try {
        const r = await apiCall('POST', `/api/user/orders/${oid}/pay-wallet`);
        alert('✅ پرداخت شد! موجودی جدید: ' + faDigits(r.balance) + ' Toman');
        loadOrders();  // refresh
      } catch (err) {
        alert('خطا: ' + err.message);
      }
    }
    // v2.23.5 (AUDIT-43 43-d#5): event delegation — دکمه‌های pay-btn از طریق
    // dataset به payWithWallet وصل می‌شوند (نه onclick درون‌خطی)
    document.addEventListener('click', (ev) => {
      const btn = ev.target.closest('.pay-btn');
      if (!btn) return;
      payWithWallet(
        parseInt(btn.dataset.oid, 10),
        btn.dataset.orderNo || '',
        parseInt(btn.dataset.amount, 10) || 0
      );
    });
    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
