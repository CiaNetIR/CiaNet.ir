<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CiaNet — تنظیمات اکانت</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="topnav">
    <div class="brand">CiaNet</div>
    <div class="nav-items">
      <a href="dashboard.html">داشبورد</a>
      <a href="accounts.html">🤖 اکانت‌ها</a>
      <a href="chats.html">💬 چت‌ها</a>
      <a href="settings.html" class="active">⚙️ تنظیمات</a>
      <button id="logout-btn" class="link-btn">خروج</button>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h2>⚙️ تنظیمات اکانت</h2>
      <p class="hint">تنظیمات اکانت فعال در live session.</p>
      <div id="settings-form">در حال بارگذاری...</div>
      <button id="save-btn" class="primary" disabled>ذخیره تغییرات</button>
      <div id="save-result" class="success" hidden></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let original = {};
    async function loadSettings() {
      const me = await requireAuth();
      if (!me) return;
      try {
        const info = await apiCall('GET', '/api/user/account/settings');
        original = info;
        renderForm(info);
      } catch (err) {
        document.getElementById('settings-form').textContent = 'خطا: ' + err.message;
      }
    }
    function renderForm(info) {
      const proxy = info.proxy || {};
      // BUG-23u: escape ALL server-provided values (text + attributes);
      // proxy password is never echoed back into the DOM — input starts
      // empty and only carries a value the user newly typed.
      document.getElementById('settings-form').innerHTML = `
        <div class="info-grid">
          <div><span>🏷️ تگ:</span> <code>${escapeHtml(info.tag)}</code></div>
          <div><span>🆔 آیدی تلگرام:</span> <code>${escapeHtml(info.tg_user_id || '—')}</code></div>
          <div><span>👤 نام تلگرام:</span> <code>${escapeHtml(info.live_name || '—')}</code></div>
          <div><span>📞 تلفن تلگرام:</span> <code>${escapeHtml(info.live_phone || '—')}</code></div>
          <div><span>👤 یوزرنیم تلگرام:</span> <code>${escapeHtml(info.live_username || '—')}</code></div>
        </div>
        <h3 style="margin-top:20px">تنظیمات قابل ویرایش:</h3>
        <div class="step">
          <label>📞 شماره موبایل</label>
          <input type="text" id="phone" value="${escapeHtml(info.phone || '')}" placeholder="+989123456789">
        </div>
        <div class="step">
          <label>🔑 API ID</label>
          <input type="number" id="api_id" value="${escapeHtml(info.api_id || '')}">
        </div>
        <div class="step">
          <label>🔒 API Hash</label>
          <input type="text" id="api_hash" value="${escapeHtml(info.api_hash || '')}">
        </div>
        <h4>🌐 پروکسی</h4>
        <div class="step">
          <label>نوع پروکسی</label>
          <select id="proxy_type">
            <option value="socks5" ${proxy.proxy_type==='socks5'?'selected':''}>SOCKS5</option>
            <option value="socks4" ${proxy.proxy_type==='socks4'?'selected':''}>SOCKS4</option>
            <option value="http" ${proxy.proxy_type==='http'?'selected':''}>HTTP</option>
            <option value="">بدون پروکسی</option>
          </select>
        </div>
        <div class="step">
          <label>آدرس</label>
          <input type="text" id="proxy_addr" value="${escapeHtml(proxy.addr || '')}" placeholder="127.0.0.1">
        </div>
        <div class="step">
          <label>پورت</label>
          <input type="number" id="proxy_port" value="${escapeHtml(proxy.port || '')}" placeholder="10808">
        </div>
        <div class="step">
          <label>نام کاربری (اختیاری)</label>
          <input type="text" id="proxy_username" value="${escapeHtml(proxy.username || '')}">
        </div>
        <div class="step">
          <label>رمز (اختیاری)</label>
          <input type="password" id="proxy_password" value="" placeholder="برای تغییر، پسورد جدید وارد کن" autocomplete="new-password">
        </div>
        <div class="step">
          <label>
            <input type="checkbox" id="proxy_rdns" ${proxy.rdns?'checked':''}> DNS معکوس از طریق پروکسی
          </label>
        </div>
        <div class="step">
          <label>
            <input type="checkbox" id="disabled" ${info.disabled?'checked':''}> اکانت غیرفعال
          </label>
        </div>
      `;
      document.getElementById('save-btn').disabled = false;
    }
    document.getElementById('save-btn').addEventListener('click', async () => {
      const proxy_type = document.getElementById('proxy_type').value;
      // BUG-23u: password is only sent when the user typed a new one;
      // otherwise the stored value from `original` (JS memory, not visible
      // DOM) is re-sent because the backend replaces the whole proxy dict.
      const typedPass = document.getElementById('proxy_password').value;
      const existingPass = (original.proxy && original.proxy.password) || undefined;
      const updates = {
        phone: document.getElementById('phone').value.trim() || null,
        api_id: parseInt(document.getElementById('api_id').value) || null,
        api_hash: document.getElementById('api_hash').value.trim() || null,
        disabled: document.getElementById('disabled').checked,
      };
      if (proxy_type) {
        updates.proxy = {
          proxy_type: proxy_type,
          addr: document.getElementById('proxy_addr').value.trim(),
          port: parseInt(document.getElementById('proxy_port').value) || 0,
          username: document.getElementById('proxy_username').value.trim() || undefined,
          password: typedPass !== '' ? typedPass : existingPass,
          rdns: document.getElementById('proxy_rdns').checked,
        };
      } else {
        updates.proxy = null;
      }
      try {
        const r = await apiCall('PATCH', '/api/user/account/settings', updates);
        const result = document.getElementById('save-result');
        result.textContent = '✅ ذخیره شد: ' + (r.changes || []).join(', ') + (r.note ? '\n' + r.note : '');
        result.hidden = false;
      } catch (err) {
        alert('خطا: ' + err.message);
      }
    });
    document.addEventListener('DOMContentLoaded', loadSettings);
  </script>
</body>
</html>
