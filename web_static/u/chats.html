<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CiaNet — چت‌ها</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .chats-layout { display: flex; gap: 16px; height: calc(100vh - 100px); }
    .chats-list { width: 280px; overflow-y: auto; border-left: 1px solid var(--border); padding-left: 12px; }
    .chat-view { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 10px; border-bottom: 1px solid var(--border); font-weight: 600; }
    .messages { flex: 1; overflow-y: auto; padding: 10px; }
    .msg { padding: 8px 12px; margin: 4px 0; border-radius: 8px; max-width: 70%; }
    .msg.out { background: #2563eb; color: white; margin-right: auto; }
    .msg.in { background: #334155; }
    .msg .sender { font-size: 0.75rem; opacity: 0.7; margin-bottom: 2px; }
    .msg .time { font-size: 0.7rem; opacity: 0.6; }
    .chat-item { padding: 10px; border-radius: 6px; cursor: pointer; }
    .chat-item:hover { background: rgba(245,158,11,0.1); }
    .chat-item.active { background: rgba(245,158,11,0.2); }
    .send-bar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
    .send-bar input { flex: 1; }
    .chat-item .unread { background: var(--accent); color: #1a1a1a; border-radius: 10px; padding: 2px 6px; font-size: 0.75rem; font-weight: 600; }
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="brand">CiaNet</div>
    <div class="nav-items">
      <a href="dashboard.html">داشبورد</a>
      <a href="accounts.html">🤖 اکانت‌ها</a>
      <a href="chats.html" class="active">💬 چت‌ها</a>
      <a href="account_settings.html">⚙️ تنظیمات</a>
      <button id="logout-btn" class="link-btn">خروج</button>
    </div>
  </nav>

  <div class="container" style="padding: 12px; max-width: 100%;">
    <div class="chats-layout">
      <div class="chats-list" id="chats-list">در حال بارگذاری...</div>
      <div class="chat-view" id="chat-view" hidden>
        <div class="chat-header" id="chat-header">—</div>
        <div class="messages" id="messages"></div>
        <div class="send-bar">
          <input type="text" id="msg-input" placeholder="پیام بنویس...">
          <button id="send-btn" class="primary" style="width:auto;margin:0">ارسال</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let currentChatId = null;
    async function loadChats() {
      const me = await requireAuth();
      if (!me) return;
      try {
        const data = await apiCall('GET', '/api/user/chats?limit=50');
        renderChats(data.chats || []);
      } catch (err) {
        document.getElementById('chats-list').textContent = 'خطا: ' + err.message;
      }
    }
    function renderChats(chats) {
      const c = document.getElementById('chats-list');
      if (!chats.length) {
        c.innerHTML = '<p class="hint">چتی وجود ندارد یا اکانتی انتخاب نشده.</p>';
        return;
      }
      c.innerHTML = '';
      for (const chat of chats) {
        const div = document.createElement('div');
        div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
        const date = chat.last_message_date ? new Date(chat.last_message_date).toLocaleString('fa-IR') : '';
        const typeIcon = {'private':'👤','group':'👥','channel':'📢'}[chat.type] || '💬';
        div.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center">
            <strong>${typeIcon} ${escapeHtml(chat.name)}</strong>
            ${chat.unread ? `<span class="unread">${chat.unread}</span>` : ''}
          </div>
          <div class="hint" style="margin-top:2px">${date}</div>
        `;
        div.addEventListener('click', () => openChat(chat.id, chat.name));
        c.appendChild(div);
      }
    }
    async function openChat(chatId, name) {
      currentChatId = chatId;
      document.getElementById('chat-view').hidden = false;
      document.getElementById('chat-header').textContent = name;
      document.getElementById('messages').innerHTML = 'در حال بارگذاری...';
      try {
        const data = await apiCall('GET', `/api/user/chats/${chatId}/messages?limit=50`);
        renderMessages(data.messages || []);
        loadChats(); // refresh active state
      } catch (err) {
        document.getElementById('messages').textContent = 'خطا: ' + err.message;
      }
    }
    function renderMessages(msgs) {
      const c = document.getElementById('messages');
      c.innerHTML = '';
      for (const m of msgs) {
        const div = document.createElement('div');
        div.className = 'msg ' + (m.out ? 'out' : 'in');
        const time = m.date ? new Date(m.date).toLocaleTimeString('fa-IR') : '';
        div.innerHTML = `
          ${!m.out ? `<div class="sender">${escapeHtml(m.sender_name)}</div>` : ''}
          <div>${escapeHtml(m.text)}</div>
          <div class="time">${time}</div>
        `;
        c.appendChild(div);
      }
      c.scrollTop = c.scrollHeight;
    }
    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !currentChatId) return;
      input.value = '';
      try {
        await apiCall('POST', `/api/user/chats/${currentChatId}/send`, {text});
        openChat(currentChatId, document.getElementById('chat-header').textContent);
      } catch (err) {
        alert('خطا در ارسال: ' + err.message);
      }
    }
    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('msg-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });
    document.addEventListener('DOMContentLoaded', loadChats);
  </script>
</body>
</html>
