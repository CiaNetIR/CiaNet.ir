<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تیکت‌ها — CiaNet Panel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><div class="loading">در حال بارگذاری…</div></div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
  <script>
    (async () => {
      const user = await checkAuth();
      if (!user) { location.href = "login.html"; return; }

      async function load(filter = "open") {
        const params = new URLSearchParams({ status_filter: filter, page: "1", page_size: "50" });
        const r = await api(`/api/tickets?${params}`);
        const items = (r.items || []).map(t => `
          <div class="card mb-2" onclick="loadTicket(${t.id})" style="cursor: pointer;">
            <div class="flex-between">
              <span class="text-muted text-sm">#${t.id}</span>
              <span class="badge badge-${t.status === "open" ? "yellow" : "green"}">${t.status}</span>
            </div>
            <div style="font-weight: 500; margin-top: 0.25rem;">${t.unit || "تیکت #" + t.id}</div>
            <div class="text-muted text-sm">user: ${t.user_id}</div>
          </div>
        `).join("");

        document.getElementById("app").innerHTML = layout(`
          <div class="header"><h1>تیکت‌ها</h1></div>
          <div class="flex gap-2 mb-4">
            ${["open", "closed", ""].map(f => `
              <button class="btn ${filter === f ? "btn-primary" : ""}" onclick="load('${f}')">${f || "همه"}</button>
            `).join("")}
          </div>
          <div class="grid grid-2">
            <div>${items || '<div class="text-muted">تیکتی پیدا نشد</div>'}</div>
            <div class="card" id="ticketDetail">
              <div class="text-muted text-center py-8">یک تیکت انتخاب کن</div>
            </div>
          </div>
        `);
      }

      window.loadTicket = async (id) => {
        try {
          const r = await api(`/api/tickets/${id}`);
          const msgs = (r.messages || []).map(m => `
            <div class="card mb-2" style="background: ${m.sender_role === "user" ? "var(--bg-muted)" : "rgba(96,165,250,0.1)"};">
              <div class="text-muted text-sm">${m.sender_role === "user" ? "کاربر" : "پشتیبانی"} ${m.sender_id}</div>
              <div style="margin-top: 0.25rem;">${m.text || ""}</div>
            </div>
          `).join("");
          document.getElementById("ticketDetail").innerHTML = `
            <h2>#${r.ticket.id} — ${r.ticket.unit || "بدون موضوع"}</h2>
            <div style="max-height: 300px; overflow-y: auto; margin: 1rem 0;">${msgs}</div>
            <textarea class="input mb-2" id="replyText" rows="3" placeholder="پاسخ..."></textarea>
            <button class="btn btn-primary" onclick="sendReply(${id})">ارسال</button>
          `;
        } catch (e) { showToast(e.message, true); }
      };
      window.sendReply = async (id) => {
        const text = document.getElementById("replyText").value.trim();
        if (!text) return;
        try {
          await api(`/api/tickets/${id}/reply`, {
            method: "POST", body: JSON.stringify({ text })
          });
          showToast("ارسال شد ✓");
          loadTicket(id);
        } catch (e) { showToast(e.message, true); }
      };

      load();
    })();
  </script>
</body>
</html>
