<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CiaNet Admin — آنالیتیکس</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
          integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g"
          crossorigin="anonymous"></script>
  <style>
    /* P2-6: استایل‌های نوار بالا — این کلاس‌ها در markup بودند ولی در هیچ CSSای
       تعریف نشده بودند (صفحه قبلاً مرده بود و دیده نمی‌شد) — با پالت ادمین هماهنگ شد */
    .topnav {
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
      padding: 0.75rem 1.5rem; margin-bottom: 1rem;
      background: var(--bg-card); border-bottom: 1px solid var(--border);
    }
    .topnav .brand { color: var(--primary); font-weight: 700; font-size: 1.1rem; }
    .topnav .nav-items { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .topnav .nav-items a { color: var(--fg-muted); text-decoration: none; font-size: 0.9rem; }
    .topnav .nav-items a:hover { color: var(--fg); }
    .topnav .nav-items a.active { color: var(--primary); font-weight: 600; }
    .container { padding: 0 1.5rem 1.5rem; }
    .link-btn {
      display: inline-block; padding: 0.4rem 0.85rem; border-radius: 0.35rem;
      font-size: 0.85rem; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg-muted); color: var(--fg);
    }
    .link-btn:hover { background: var(--border); }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { padding: 16px; border-radius: 8px; background: rgba(15,23,42,0.4); border-left: 3px solid var(--primary); }
    .stat-card .label { font-size: 0.85rem; color: var(--fg-muted); }
    .stat-card .value { font-size: 1.5rem; font-weight: 700; margin-top: 6px; }
    .chart-container { background: rgba(15,23,42,0.4); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    .chart-container canvas { max-height: 300px; }
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="brand">CiaNet Admin</div>
    <div class="nav-items">
      <a href="/app/dashboard.html">داشبورد</a>
      <a href="/app/users.html">کاربران</a>
      <a href="/app/finance.html">امور مالی</a>
      <a href="/app/audit.html">لاگ فعالیت</a>
      <a href="/app/analytics.html" class="active">📊 آنالیتیکس</a>
      <a href="/app/settings.html">تنظیمات</a>
    </div>
  </nav>

  <div class="container" style="max-width:1200px;">
    <div class="stat-grid" id="stat-grid">در حال بارگذاری...</div>
    <div class="chart-container">
      <h3>📈 درآمد ۳۰ روز اخیر</h3>
      <canvas id="revenueChart"></canvas>
    </div>
    <div class="chart-container">
      <h3>📊 وضعیت اشتراک‌ها</h3>
      <canvas id="subChart"></canvas>
    </div>
    <div style="margin-top:20px;text-align:center">
      <a href="/api/analytics/export" class="link-btn" style="text-decoration:none;padding:10px 20px;display:inline-block">📥 خروجی CSV سفارش‌ها</a>
    </div>
  </div>

  <script>
    // auth: کوکی session از نوع HttpOnly است و از document.cookie خوانده نمی‌شه؛
    // پس وضعیت لاگین را از API می‌پرسیم و فقط روی 401 ریدایرکت می‌کنیم.
    async function checkAdminAuth() {
      try {
        const r = await fetch('/api/auth/me', { credentials: 'include' });
        return r.status !== 401;
      } catch (e) {
        return true; // خطای شبکه — ادامه می‌دهیم؛ لودرها خطا را نشان می‌دهند
      }
    }

    async function apiCall(method, path) {
      const r = await fetch(path, { method, credentials: 'include' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }
    function faDigits(n) {
      return String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[+d]);
    }
    function fmt(n) {
      return faDigits(Number(n).toLocaleString('en-US'));
    }

    async function loadOverview() {
      try {
        const d = await apiCall('GET', '/api/analytics/overview');
        document.getElementById('stat-grid').innerHTML = `
          <div class="stat-card"><div class="label">MRR (۳۰ روز)</div><div class="value">${fmt(d.mrr_toman)} Toman</div></div>
          <div class="stat-card"><div class="label">کل درآمد</div><div class="value">${fmt(d.total_revenue_toman)} Toman</div></div>
          <div class="stat-card"><div class="label">کاربران کل</div><div class="value">${fmt(d.total_users)}</div></div>
          <div class="stat-card"><div class="label">اشتراک‌های فعال</div><div class="value">${fmt(d.active_subscriptions)}</div></div>
          <div class="stat-card"><div class="label">ARPU</div><div class="value">${fmt(d.arpu_toman)} Toman</div></div>
          <div class="stat-card"><div class="label">نرخ churn</div><div class="value">${faDigits(d.churn_rate_percent)}%</div></div>
        `;
      } catch (err) {
        // P2-6: خطای فارسی + دکمه‌ی تلاش مجدد (سبک renderError) — با DOM API ساخته
        // می‌شود تا message سرور بدون escape داخل HTML نیفتد
        const sg = document.getElementById('stat-grid');
        if (!sg) return;
        sg.textContent = '';
        const box = document.createElement('div');
        box.className = 'error';
        box.style.marginBottom = '12px';
        box.textContent = 'خطا: ' + err.message;
        const btn = document.createElement('button');
        btn.className = 'btn btn-primary';
        btn.style.marginTop = '8px';
        btn.textContent = '🔄 تلاش مجدد';
        btn.onclick = () => location.reload();
        sg.append(box, btn);
      }
    }

    async function loadRevenueChart() {
      try {
        const d = await apiCall('GET', '/api/analytics/daily-revenue');
        new Chart(document.getElementById('revenueChart'), {
          type: 'line',
          data: {
            labels: d.labels,
            datasets: [{
              label: 'درآمد (Toman)',
              data: d.revenue,
              borderColor: '#f59e0b',
              backgroundColor: 'rgba(245,158,11,0.1)',
              fill: true, tension: 0.3,
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      } catch (err) {
        // P2-6: خطای نمودار فقط در console بود و بوم خالی می‌ماند — حالا پیام فارسی نشان می‌دهد
        console.error(err);
        const el = document.getElementById('revenueChart');
        if (el) {
          el.style.display = 'none';
          const d = document.createElement('div');
          d.className = 'error';
          d.textContent = 'خطا در بارگذاری نمودار — صفحه را رفرش کن';
          el.parentNode.insertBefore(d, el);
        }
      }
    }

    async function loadSubChart() {
      try {
        const d = await apiCall('GET', '/api/analytics/subscription-stats');
        new Chart(document.getElementById('subChart'), {
          type: 'doughnut',
          data: {
            labels: ['فعال', 'منقضی', 'بدون اشتراک', 'در انتظار'],
            datasets: [{
              data: [d.active, d.expired, d.no_subscription, d.pending],
              backgroundColor: ['#22c55e', '#ef4444', '#64748b', '#f59e0b'],
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      } catch (err) {
        // P2-6: مثل نمودار درآمد — پیام فارسی به‌جای بوم خالی
        console.error(err);
        const el = document.getElementById('subChart');
        if (el) {
          el.style.display = 'none';
          const d = document.createElement('div');
          d.className = 'error';
          d.textContent = 'خطا در بارگذاری نمودار — صفحه را رفرش کن';
          el.parentNode.insertBefore(d, el);
        }
      }
    }

    (async () => {
      if (await checkAdminAuth()) {
        Promise.all([loadOverview(), loadRevenueChart(), loadSubChart()]);
      } else {
        window.location.href = '/app/login.html';
      }
    })();
  </script>
</body>
</html>
